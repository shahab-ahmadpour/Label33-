services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: label33-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Label33_Strong_Pass!"
    ports:
      - "1433:1433"
    volumes:
      - label33_sql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Label33_Strong_Pass!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  label33_sql_data:
